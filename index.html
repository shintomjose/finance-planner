<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        var m = null;
        try { m = localStorage.getItem('fp.theme'); } catch (e) { /* private mode */ }
        // Default mode is LIGHT (mirrors lib/theme.ts loadThemeMode); OS
        // preference only applies when 'system' was explicitly chosen.
        var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a6fc0" />
    <title>Finance Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
